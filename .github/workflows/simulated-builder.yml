name: Simulated builder

# A maintainer starts an end-to-end run for one reviewed commit of a pull request: a simulated
# partner developer builds with the toolkit at that commit in Kiro, in a test AWS account, and the
# result comes back as the `simulated-builder` commit status (see e2e/README.md).
# This workflow only records the request (its run name) and marks the commit as waiting. It checks
# out nothing, runs no PR code and has no AWS access. The test account reads the public run list
# and accepts only a manual run of this workflow on main, started by a maintainer, whose commit is
# still the PR head.
run-name: "simulated-builder #${{ inputs.pr }} ${{ inputs.sha }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      sha:
        description: The reviewed head commit (40 hex characters)
        required: true

permissions:
  statuses: write

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs and mark the commit as waiting
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$PR" =~ ^[0-9]{1,6}$ && "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "pr must be a number and sha 40 hex characters"; exit 1; }
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          [ "$head" = "$SHA" ] || { echo "PR #$PR head is $head, not $SHA: review the new commit and start again"; exit 1; }
          gh api "repos/$REPO/statuses/$SHA" -f state=pending -f context=simulated-builder \
            -f description="Requested by $GITHUB_ACTOR; waiting for the test account"
