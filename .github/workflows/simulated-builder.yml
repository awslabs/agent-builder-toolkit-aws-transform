name: Simulated builder

# A maintainer adds the `e2e:simulated-builder` label to ask for an end-to-end run: a simulated
# partner developer builds with the toolkit at the PR's head commit in Kiro, on a disposable AWS
# account, and the maintainer posts the verdict as the `simulated-builder` commit status
# (see e2e/README.md). This workflow only marks the head commit as waiting for that run: it
# checks out nothing, runs no PR code and uses no secrets.
on:
  pull_request_target:
    types: [labeled, synchronize, reopened]

permissions:
  statuses: write

jobs:
  queue:
    # A new label marks the commit once; a new push or reopen re-marks the new head while the label stays.
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'e2e:simulated-builder') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'e2e:simulated-builder'))
    runs-on: ubuntu-latest
    steps:
      - name: Mark the head commit as waiting for the simulated builder
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state=pending -f context=simulated-builder \
            -f description="Queued for a simulated-builder run (e2e/README.md)"
