name: Internal Reference Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  internal-ref-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for non-public hosts and access keys
        run: |
          # Any amazon.com / amazon.dev host other than the public
          # aws.amazon.com sites, and AWS access key IDs.
          hosts=$(git grep -noiE '[a-z0-9.-]*[a-z0-9][.-]amazon\.(com|dev)' \
            | grep -viE ':([a-z0-9-]+\.)*aws\.amazon\.com$' || true)
          keys=$(git grep -noE 'AKIA[0-9A-Z]{16}' || true)
          hits=$(printf '%s\n%s\n' "$hosts" "$keys" | sed '/^$/d')

          if [[ -n "$hits" ]]; then
            echo "::error::Non-public hosts or access keys found. Remove them before merging:"
            echo "$hits"
            exit 1
          fi

          echo "No non-public hosts or access keys found."
